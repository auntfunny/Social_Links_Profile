<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body
    class="grid grid-cols-[auto_20rem_auto] md:grid-cols-[auto_22rem_auto] grid-rows-[auto_36rem_auto] md:grid-rows-[auto_34rem_auto] h-screen w-screen bg-(--acc1) font-[Inter]"
  >
    <div class="col-span-3"></div>
    <div></div>
    <div
      class="flex flex-col justify-center items-center h-full gap-4 text-sm bg-(--acc2) rounded-2xl"
    >
      <img
        class="h-20 w-20 rounded-full m-2"
        src="./src/images/avatar-jessica.jpeg"
        alt="Photo of Jessica"
      />
      <div class="flex flex-col items-center justify-center gap-1">
        <h1 class="text-(--acc4) font-semibold text-2xl">Jessica Randall</h1>
        <h2 class="mb-2 font-medium text-(--acc5)">London, United Kingdom</h2>
      </div>

      <p class="text-(--acc4) font-extralight mb-1">
        "Front-end developer and avid reader."
      </p>
      <a
        class="w-4/5 rounded-lg font-medium text-center p-2 bg-(--acc3) text-(--acc4) hover:text-(--acc5) hover:scale-105 transition-all duration-300"
        href=""
        >GitHub</a
      >
      <a
        class="w-4/5 rounded-lg font-medium text-center p-2 bg-(--acc3) text-(--acc4) hover:text-(--acc5) hover:scale-105 transition-all duration-300"
        href=""
        >Frontend Mentor</a
      >
      <a
        class="w-4/5 rounded-lg font-medium text-center p-2 bg-(--acc3) text-(--acc4) hover:text-(--acc5) hover:scale-105 transition-all duration-300"
        href=""
        >LinkedIn</a
      >
      <a
        class="w-4/5 rounded-lg font-medium text-center p-2 bg-(--acc3) text-(--acc4) hover:text-(--acc5) hover:scale-105 transition-all duration-300"
        href=""
        >Twitter</a
      >
      <a
        class="w-4/5 rounded-lg font-medium text-center p-2 bg-(--acc3) text-(--acc4) hover:text-(--acc5) hover:scale-105 transition-all duration-300"
        href=""
        >Instagram</a
      >
    </div>
  </body>
</html>
